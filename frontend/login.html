<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM-Master · Accesso</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: auto; }

    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 0 1rem;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .1em;
    }
    .login-logo p {
      color: var(--text-muted);
      font-size: .85rem;
      margin-top: .25rem;
    }

    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    .tab-row {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      flex: 1;
      padding: .6rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      color: var(--text-muted);
      font-size: .9rem;
      transition: color .15s, border-color .15s;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .form-group { margin-bottom: 1.1rem; }
    .form-group label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: .4rem;
    }
    .form-group input {
      width: 100%;
      padding: .6rem .75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: .95rem;
      box-sizing: border-box;
      transition: border-color .15s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-primary {
      width: 100%;
      padding: .7rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: .5rem;
      transition: opacity .15s;
    }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .error-msg {
      color: #c0392b;
      font-size: .85rem;
      margin-top: .75rem;
      text-align: center;
      min-height: 1.2em;
    }

    .invite-info {
      background: #fef9ec;
      border: 1px solid #f0d060;
      border-radius: 6px;
      padding: .75rem 1rem;
      font-size: .875rem;
      color: var(--text);
      margin-bottom: 1.1rem;
    }
    .invite-info strong { display: block; margin-bottom: .2rem; }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <h1>LLM · MASTER</h1>
    <p>Call of Cthulhu · Game Master artificiale</p>
  </div>

  <div class="login-card">

    <!-- Tab switcher (nascosto nella vista codice invito) -->
    <div class="tab-row" id="tab-row">
      <button class="tab-btn active" data-tab="player">Giocatore</button>
      <button class="tab-btn" data-tab="admin">Admin</button>
      <button class="tab-btn" data-tab="invite">Codice invito</button>
    </div>

    <!-- ── Pannello: Login giocatore ── -->
    <div class="tab-panel active" id="panel-player">
      <form id="form-player">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="player-email" autocomplete="email" required placeholder="mario@esempio.it">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="player-password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary">Entra</button>
        <div class="error-msg" id="err-player"></div>
      </form>
    </div>

    <!-- ── Pannello: Login admin ── -->
    <div class="tab-panel" id="panel-admin">
      <form id="form-admin">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="admin-username" autocomplete="username" required placeholder="admin">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="admin-password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary">Entra come admin</button>
        <div class="error-msg" id="err-admin"></div>
      </form>
    </div>

    <!-- ── Pannello: Attiva account con codice invito ── -->
    <div class="tab-panel" id="panel-invite">
      <form id="form-invite-code">
        <div class="form-group">
          <label>Codice invito</label>
          <input type="text" id="invite-code-input" autocomplete="off" required placeholder="es. A3F7C2D9E1"
                 style="text-transform:uppercase; letter-spacing:.1em;">
        </div>
        <button type="submit" class="btn-primary">Verifica codice</button>
        <div class="error-msg" id="err-invite-code"></div>
      </form>

      <form id="form-invite-activate" style="display:none;">
        <div class="invite-info" id="invite-info"></div>
        <div class="form-group">
          <label>Scegli una password</label>
          <input type="password" id="invite-password" autocomplete="new-password" required minlength="6"
                 placeholder="almeno 6 caratteri">
        </div>
        <div class="form-group">
          <label>Conferma password</label>
          <input type="password" id="invite-password2" autocomplete="new-password" required minlength="6">
        </div>
        <button type="submit" class="btn-primary">Attiva account</button>
        <div class="error-msg" id="err-invite-activate"></div>
      </form>
    </div>

  </div>
</div>

<script>
  // ── Tab logic ──────────────────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ── Player login ──────────────────────────────────────────────────────────
  document.getElementById('form-player').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('err-player');
    err.textContent = '';
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('player-email').value.trim(),
          password: document.getElementById('player-password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error; return; }
      window.location.href = data.redirect;
    } catch {
      err.textContent = 'Errore di rete.';
    } finally {
      btn.disabled = false;
    }
  });

  // ── Admin login ───────────────────────────────────────────────────────────
  document.getElementById('form-admin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('err-admin');
    err.textContent = '';
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('admin-username').value.trim(),
          password: document.getElementById('admin-password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error; return; }
      window.location.href = data.redirect;
    } catch {
      err.textContent = 'Errore di rete.';
    } finally {
      btn.disabled = false;
    }
  });

  // ── Invite: verifica codice ───────────────────────────────────────────────
  let verifiedCode = null;

  document.getElementById('form-invite-code').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = document.getElementById('invite-code-input').value.trim().toUpperCase();
    const err = document.getElementById('err-invite-code');
    err.textContent = '';
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
      const res = await fetch(`/api/auth/invite/${code}`);
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error; return; }
      verifiedCode = code;
      document.getElementById('invite-info').innerHTML =
        `<strong>Benvenuto/a, ${data.name}!</strong>${data.email}`;
      document.getElementById('form-invite-code').style.display = 'none';
      document.getElementById('form-invite-activate').style.display = 'block';
    } catch {
      err.textContent = 'Errore di rete.';
    } finally {
      btn.disabled = false;
    }
  });

  // ── Invite: attiva account ────────────────────────────────────────────────
  document.getElementById('form-invite-activate').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw1 = document.getElementById('invite-password').value;
    const pw2 = document.getElementById('invite-password2').value;
    const err = document.getElementById('err-invite-activate');
    err.textContent = '';
    if (pw1 !== pw2) { err.textContent = 'Le password non coincidono.'; return; }
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
      const res = await fetch(`/api/auth/invite/${verifiedCode}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw1 }),
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error; return; }
      window.location.href = data.redirect;
    } catch {
      err.textContent = 'Errore di rete.';
    } finally {
      btn.disabled = false;
    }
  });

  // ── Auto-select tab from URL hash ─────────────────────────────────────────
  if (location.hash === '#invite') {
    document.querySelector('[data-tab="invite"]').click();
  } else if (location.hash === '#admin') {
    document.querySelector('[data-tab="admin"]').click();
  }
</script>
</body>
</html>
