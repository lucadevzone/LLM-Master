<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM-Master · Call of Cthulhu</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
<div id="app">

  <!-- ══ SCHERMATA DI AVVIO ══════════════════════════════════════════════════ -->
  <div id="screen-start">
    <div class="start-title">
      <h1>LLM · MASTER</h1>
      <p>Call of Cthulhu · Gioco di ruolo testuale con Game Master artificiale</p>
    </div>

    <div class="start-sections">
      <!-- Continua partita -->
      <div class="start-section">
        <h2>Continua partita</h2>
        <div id="session-list" class="session-list">
          <div class="empty-state">Caricamento...</div>
        </div>
      </div>

      <!-- Nuova avventura -->
      <div class="start-section">
        <h2>Nuova avventura</h2>
        <div id="adventure-grid" class="adventure-grid">
          <div class="empty-state">Caricamento...</div>
        </div>
        <button class="upload-btn" id="upload-adventure-btn">
          + Carica avventura (.md)
        </button>
        <input type="file" id="upload-file-input" accept=".md,.yaml,.yml" style="display:none">
      </div>
    </div>
  </div>

  <!-- ══ SCHERMATA DI GIOCO ══════════════════════════════════════════════════ -->
  <div id="screen-game">

    <!-- Header -->
    <div id="game-header">
      <div class="title" id="game-title">LLM-Master</div>
      <div class="controls">
        <select id="model-select" title="Modello LLM"></select>
        <button id="mode-toggle" class="creative" title="Modalità: creativa (2 fasi) o veloce (1 fase)">Creativo</button>
      </div>
    </div>

    <!-- Body: chat + scheda -->
    <div id="game-body">

      <!-- Pannello chat -->
      <div id="chat-panel">
        <div id="messages"></div>
        <div id="status-bar"><span id="status-text"></span></div>

        <!-- Indicatore floor (solo multiplayer) -->
        <div id="floor-indicator" style="display:none"></div>

        <div id="action-area"></div>

        <!-- Area input unificata -->
        <div id="input-area">
          <textarea
            id="input-text"
            placeholder="Cosa fai?"
            rows="1"
          ></textarea>
          <div id="input-buttons">
            <button id="declare-btn">Dichiara</button>
            <button id="interrupt-btn" style="display:none" title="Intervieni senza occupare il turno">Fuori Turno</button>
            <button id="hand-btn" style="display:none" title="Chiedi la parola">🙋 Parola</button>
            <button id="dice-action-btn" style="display:none" title="Esegui la prova richiesta">⬡ Prova</button>
            <button id="pass-turn-btn" style="display:none" title="Rilascia il turno senza agire">Passa turno</button>
          </div>
        </div>
      </div>

      <!-- Pannello scheda personaggio con tab -->
      <div id="character-panel">
        <div id="char-tabs">
          <button class="char-tab active" data-tab="scheda">Scheda</button>
          <button class="char-tab" data-tab="diario">Diario</button>
          <button class="char-tab" data-tab="sessione">Sessione</button>
        </div>
        <div id="tab-scheda" class="tab-content">
          <div class="empty-state" style="padding-top: 2rem">Nessun personaggio</div>
        </div>
        <div id="tab-diario" class="tab-content" style="display:none">
          <div class="diary-section">
            <div class="char-section-title">Diario di sessione</div>
            <div id="diary-list"><div class="empty-state">Nessun evento registrato.</div></div>
          </div>
          <div class="diary-section">
            <div class="char-section-title">Note personali</div>
            <textarea id="player-notes" placeholder="Scrivi qui le tue note…"></textarea>
          </div>
        </div>
        <div id="tab-sessione" class="tab-content" style="display:none">
          <div id="session-players-list"></div>
          <button id="close-session-btn" class="btn-close-session" style="display:none">⚠ Proponi di chiudere la sessione</button>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- ══ MODAL CREAZIONE PERSONAGGIO ══════════════════════════════════════════ -->
<div id="modal-character">
  <div class="modal-box">
    <h2>Crea il tuo personaggio</h2>
    <form id="form-character">

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
        <div class="form-group">
          <label>Nome</label>
          <input type="text" name="char-name" required placeholder="es. Emilio Ferretti">
        </div>
        <div class="form-group">
          <label>Occupazione</label>
          <input type="text" name="char-occupation" required placeholder="es. Professore">
        </div>
        <div class="form-group">
          <label>Età</label>
          <input type="number" name="char-age" value="35" min="18" max="90">
        </div>
        <div class="form-group">
          <label>Città di residenza</label>
          <input type="text" name="char-residence" placeholder="es. Napoli">
        </div>
      </div>

      <div class="form-group" style="margin-top: 1rem;">
        <label>Caratteristiche (×5, 15-90)</label>
        <div class="characteristics-grid">
          <div class="stat-box">
            <label>STR</label><input type="number" id="stat-STR" min="15" max="90" value="50">
          </div>
          <div class="stat-box">
            <label>CON</label><input type="number" id="stat-CON" min="15" max="90" value="50">
          </div>
          <div class="stat-box">
            <label>SIZ</label><input type="number" id="stat-SIZ" min="40" max="90" value="55">
          </div>
          <div class="stat-box">
            <label>DEX</label><input type="number" id="stat-DEX" min="15" max="90" value="50">
          </div>
          <div class="stat-box">
            <label>APP</label><input type="number" id="stat-APP" min="15" max="90" value="50">
          </div>
          <div class="stat-box">
            <label>INT</label><input type="number" id="stat-INT" min="40" max="90" value="60">
          </div>
          <div class="stat-box">
            <label>POW</label><input type="number" id="stat-POW" min="15" max="90" value="50">
          </div>
          <div class="stat-box">
            <label>EDU</label><input type="number" id="stat-EDU" min="40" max="90" value="65">
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn" id="btn-reroll">Tira dadi</button>
        <button type="button" class="btn" id="btn-cancel-char">Annulla</button>
        <button type="submit" class="btn primary">Inizia avventura</button>
      </div>

    </form>
  </div>
</div>

<!-- ══ MODALE VOTO DISCONNESSIONE ═══════════════════════════════════════════ -->
<div id="vote-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:500; align-items:center; justify-content:center;">
  <div style="background:var(--bg-surface,#1e1e2e); border:1px solid var(--border,#444); border-radius:10px; padding:2rem; max-width:420px; width:90%; text-align:center;">
    <p id="vote-message" style="margin-bottom:1.5rem; font-size:1rem; color:var(--text,#eee);"></p>
    <div id="vote-tally" style="font-size:.85rem; color:var(--text-muted,#aaa); margin-bottom:1.25rem;"></div>
    <div style="display:flex; gap:1rem; justify-content:center;">
      <button id="vote-continue-btn" style="padding:.6rem 1.4rem; background:var(--accent,#7c3aed); color:#fff; border:none; border-radius:6px; font-size:.95rem; font-weight:700; cursor:pointer;">
        Continuiamo
      </button>
      <button id="vote-stop-btn" style="padding:.6rem 1.4rem; background:none; border:1px solid var(--border,#444); color:var(--text-muted,#aaa); border-radius:6px; font-size:.95rem; cursor:pointer;">
        Chiudiamo qui
      </button>
    </div>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
